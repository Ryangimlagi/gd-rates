<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Worthy Level Finder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin: 0 0 5px 0;
            font-size: 32px;
        }
        .credits {
            color: #aaa;
            font-size: 14px;
            margin: 0;
        }
        .credits b {
            color: #ffd700;
        }

        /* Container für die Buttons */
        .controls-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Quetsch-Effekt für die Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .btn-group:last-child {
            margin-bottom: 0;
        }

        .custom-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.7;
            transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            user-select: none;
        }

        /* Beim Draufklicken leicht quetschen/eindrücken */
        .custom-btn:active {
            transform: translateY(3px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        .custom-btn.active {
            opacity: 1;
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }

        /* Farben der Rate-Buttons */
        .btn-all { background: #555; }
        .btn-star { background: #ffd700; color: #000; }
        .btn-featured { background: #1e90ff; }
        .btn-epic { background: #ff1493; }
        .btn-legendary { background: #9932cc; }
        .btn-mythic { background: #ff4500; }

        /* Farben der Difficulty-Buttons */
        .btn-diff { background: #34495e; }
        .btn-diff.active { background: #2ecc71; color: #fff; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .level-item {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 6px solid #ffd700;
        }

        .level-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .level-thumb {
            width: 110px;
            height: 62px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #000;
        }

        .level-details h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 16px;
        }

        .level-details p {
            margin: 0;
            font-size: 13px;
            color: #aaa;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .mythic { background: #ff4500; }
        .legendary { background: #9932cc; }
        .epic { background: #ff1493; }
        .featured { background: #1e90ff; }
        .star { background: #ffd700; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⭐ GD Worthy Level Finder ⭐</h1>
        <p class="credits">Created by <b>Ryangimlagi</b></p>
    </div>
    
    <div class="controls-card">
        <div class="section-title">1. Rate auswählen</div>
        <div class="btn-group">
            <button class="custom-btn btn-all active" onclick="setRate('all', this)">Alle</button>
            <button class="custom-btn btn-star" onclick="setRate('star', this)">Star Rate</button>
            <button class="custom-btn btn-featured" onclick="setRate('featured', this)">Featured</button>
            <button class="custom-btn btn-epic" onclick="setRate('epic', this)">Epic</button>
            <button class="custom-btn btn-legendary" onclick="setRate('legendary', this)">Legendär</button>
            <button class="custom-btn btn-mythic" onclick="setRate('mythic', this)">Mythic</button>
        </div>

        <div class="section-title">2. Schwierigkeit auswählen</div>
        <div class="btn-group">
            <button class="custom-btn btn-diff active" onclick="setDifficulty('all', this)">Alle</button>
            <button class="custom-btn btn-diff" onclick="setDifficulty('normal', this)">Auto - Insane (1-9★)</button>
            <button class="custom-btn btn-diff" onclick="setDifficulty('demon', this)">👹 Demons</button>
        </div>
    </div>

    <div class="card">
        <div id="levelList">
            <!-- Hier erscheinen die Level -->
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // HIER FÜGST DU ALS ADMIN DEINE LEVEL EIN!
    // =========================================================================
    // - difficulty: 'normal' (Auto-Insane 1-9 Sterne) oder 'demon'
    // - rate: 'star', 'featured', 'epic', 'legendary' oder 'mythic'
    // =========================================================================

    const levels = [
        {
            name: "Slaughterhouse Layout",
            id: "12345678",
            creator: "SpaceUK",
            difficulty: "demon",
            rate: "mythic",
            image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300"
        },
        {
            name: "Cool Insane 9 Stars",
            id: "87654321",
            creator: "Ryangimlagi",
            difficulty: "normal",
            rate: "epic",
            image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300"
        },
        {
            name: "Easy Auto Level",
            id: "99999999",
            creator: "GD_Builder",
            difficulty: "normal",
            rate: "star",
            image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300"
        }
    ];

    let selectedRate = 'all';
    let selectedDifficulty = 'all';

    function setRate(rate, btn) {
        selectedRate = rate;
        btn.parentElement.querySelectorAll('.custom-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderLevels();
    }

    function setDifficulty(diff, btn) {
        selectedDifficulty = diff;
        btn.parentElement.querySelectorAll('.custom-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderLevels();
    }

    function renderLevels() {
        const listContainer = document.getElementById('levelList');
        listContainer.innerHTML = '';
        
        const filtered = levels.filter(lvl => {
            const matchesRate = (selectedRate === 'all') || (lvl.rate === selectedRate);
            const matchesDiff = (selectedDifficulty === 'all') || (lvl.difficulty === selectedDifficulty);
            return matchesRate && matchesDiff;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align: center; color: #888;">Keine Level für diese Auswahl gefunden.</p>';
            return;
        }

        filtered.forEach((lvl) => {
            listContainer.innerHTML += `
                <div class="level-item" style="border-left-color: ${getRateColor(lvl.rate)};">
                    <div class="level-info">
                        <img src="${lvl.image}" alt="Screenshot" class="level-thumb">
                        <div class="level-details">
                            <h4>${lvl.name}</h4>
                            <p>ID: <b>${lvl.id}</b> | Ersteller: <b>${lvl.creator}</b></p>
                        </div>
                    </div>
                    <span class="badge ${lvl.rate}">${lvl.rate.toUpperCase()}</span>
                </div>
            `;
        });
    }

    function getRateColor(rate) {
        if(rate === 'mythic') return '#ff4500';
        if(rate === 'legendary') return '#9932cc';
        if(rate === 'epic') return '#ff1493';
        if(rate === 'featured') return '#1e90ff';
        return '#ffd700';
    }

    renderLevels();
</script>

</body>
</html>
